<style>
html{background:#0d0d0d}
#splash{position:fixed;inset:0;z-index:99999;background:#0d0d0d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;opacity:1;transition:opacity .6s ease;-webkit-tap-highlight-color:transparent}
#splash.out{opacity:0;pointer-events:none}
#splash .sp-logo{position:relative;width:min(46vw,196px);aspect-ratio:1/1;border-radius:50%;flex:none}
#splash .sp-logo::before{content:"";position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,74,.38) 0,rgba(201,162,74,0) 68%);opacity:.4;animation:spPulse 2.6s ease-in-out infinite;will-change:opacity}
#splash .sp-logo img{position:relative;display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#0d0d0d}
#splash .sp-name{font:700 13px/1 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.42em;color:#c9a24a;text-transform:uppercase;padding-left:.42em;opacity:0;animation:spFade .6s ease .15s forwards}
#splash .sp-bar{width:84px;height:2px;border-radius:2px;background:#ffffff1f;overflow:hidden;opacity:0;animation:spFade .6s ease .3s forwards}
#splash .sp-bar i{display:block;width:40%;height:100%;background:#c9a24a;border-radius:2px;animation:spBar 1.2s ease-in-out infinite;will-change:transform}
@keyframes spFade{to{opacity:1}}
@keyframes spPulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes spBar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media(prefers-reduced-motion:reduce){#splash .sp-logo::before{animation:none;opacity:.6}#splash .sp-name,#splash .sp-bar{animation:none;opacity:1}#splash .sp-bar i{animation:none;width:100%}}
</style>
