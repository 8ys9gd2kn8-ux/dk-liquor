<!-- Paste into Supabase > Authentication > Email Templates, in BOTH:
       1) "Confirm signup"        2) "Change Email Address"
     Subject line:  Your D&K verification code
     The {{ .Token }} variable is the 6-digit code the app asks for. Do not remove it. -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#111">
  <h2 style="margin:0 0 8px">Your D&amp;K verification code</h2>
  <p style="margin:0 0 16px">Enter this code in the D&amp;K app to finish creating your account:</p>
  <p style="font-size:34px;letter-spacing:8px;font-weight:bold;margin:0 0 16px">{{ .Token }}</p>
  <p style="margin:0 0 8px;color:#555">The code expires soon. Never share it with anyone, including D&amp;K staff.</p>
  <p style="margin:0;color:#555">If you did not request this, you can ignore this email.</p>
</div>
