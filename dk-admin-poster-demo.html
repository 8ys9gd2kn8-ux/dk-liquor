.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:20px;font-weight:600}.badge.red{background:#d32f3f}
.full{position:fixed;inset:0;z-index:20;background:var(--card);overflow:auto;padding-bottom:120px}
.dimg2{position:relative;overflow:hidden;height:340px;background:#fff;display:grid;place-items:center;font-size:110px;padding-top:env(safe-area-inset-top,0px)}.dimg2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:14px}.dimg2 img.bgb{padding:0;object-fit:cover;filter:blur(22px) brightness(.92);transform:scale(1.25)}
.xb{z-index:2;position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:14px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px #0003;font-size:18px;color:#191919}
.dbody{padding:16px;max-width:620px;margin:auto}.dtitle{font:800 26px/1.2 -apple-system,"Segoe UI",sans-serif;margin:8px 0}.dprice{font-size:20px;font-weight:700}

/* no zooming: stop iPhone zoom-on-focus and double-tap zoom */
input,select,textarea{font-size:16px!important}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}

/* pinned discount bar + discover lists */
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}.stick header{position:relative;top:auto}
.pbar{overflow:hidden;white-space:nowrap;background:linear-gradient(90deg,var(--pm1),var(--pm2));color:var(--pmi);font-weight:700;font-size:12px;padding:6px 0}
.pbar span{display:inline-block;padding-left:100%;animation:pmarq linear infinite}
@keyframes pmarq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.full .pbar{position:sticky;top:0;z-index:3;padding-top:calc(6px + env(safe-area-inset-top,0px))}
.lsec{background:var(--card);border-radius:16px;padding:12px 0 6px 12px;margin-bottom:12px;box-shadow:0 1px 2px #0000000d,0 4px 14px #0000000a}
.lhead{display:flex;justify-content:space-between;align-items:center;padding-right:12px;margin-bottom:10px;cursor:pointer}
.lt{display:flex;align-items:center;gap:8px}.lt i{font-style:normal;font-size:22px}.lt b{font-size:15px}.lt em{font-style:normal;color:var(--mute);font-size:12px}
.lgo{color:var(--wine);font-weight:700;font-size:13px}

#seo{max-width:720px;margin:0 auto;padding:6px 18px 20px;color:var(--mute);font-size:12px;line-height:1.55;text-align:center}#seo h2{font:700 13px/1.3 -apple-system,"Segoe UI",sans-serif;color:var(--ink);margin:0 0 6px;letter-spacing:.2px}#seo p{margin:0}

#seo a{color:var(--wine);font-weight:600;text-decoration:none}#seo .seo-contact{margin-top:8px}

/* orbit category carousel (engine adapted from React Bits OrbitImages, by Dominik Koch) */
.orbit-container{position:relative;margin-left:auto;margin-right:auto;isolation:isolate;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;width:100%}
.orbit-container[data-draggable]{cursor:grab;touch-action:pan-y pinch-zoom}
.orbit-container[data-dragging],.orbit-container[data-dragging] *{cursor:grabbing}
.orbit-path-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.orbit-item{position:absolute;top:0;left:0;will-change:transform,opacity}
.orbit-container[data-intro] .orbit-item{opacity:0}
.orbit-item[data-clickable]{cursor:pointer}
.orbit-item-inner{width:100%;height:100%;overflow:hidden;border-radius:var(--orbit-radius,0px);box-shadow:0 calc(var(--orbit-shadow,0)*16px) calc(var(--orbit-shadow,0)*36px) rgba(0,0,0,calc(var(--orbit-shadow,0)*.45));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.orbit-item:hover .orbit-item-inner,.orbit-item:focus-visible .orbit-item-inner{transform:scale(var(--orbit-hover-scale,1))}
.orbit-item:focus-visible{outline:none}
.orbit-center-content{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;pointer-events:none}
.orbit-wrap{max-width:440px;margin:0 auto;padding:4px 10px 0}
#orbit-slot{width:100%;aspect-ratio:var(--orbit-ar,1.67)}
.orbit-tile{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s,60px)*.03);background:#fff;color:#191919;border:calc(var(--s,60px)*.05) solid var(--bl);border-radius:30%;overflow:hidden;position:relative}
.orbit-tile .emo{font-style:normal;font-size:calc(var(--s,60px)*.46);line-height:1}
.orbit-tile em{font-style:normal;font-weight:800;font-size:calc(var(--s,60px)*.16);line-height:1;white-space:nowrap}
.orbit-tile.hasimg .orbit-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.orbit-tile.hasimg em{position:absolute;left:0;right:0;bottom:0;background:#000b;color:#fff;padding:calc(var(--s,60px)*.04) 0;text-align:center}
.orbit-item.sel .orbit-item-inner{box-shadow:0 0 0 calc(var(--s,60px)*.06) var(--wine),0 8px 18px #0006}
.oc{text-align:center;color:var(--pni);display:flex;flex-direction:column;align-items:center;gap:3px;max-width:42%;pointer-events:none}
.oc b{font-size:14px;font-weight:800;line-height:1.15;color:var(--pni);filter:none}
.oc span{font-size:10.5px;opacity:.9;line-height:1.2}
.obtn{pointer-events:auto;margin-top:3px;border:0;border-radius:14px;background:var(--wine);color:#fff;font-weight:700;font-size:11px;padding:5px 11px;cursor:pointer}
.obtn[hidden]{display:none}
@media(prefers-reduced-motion:reduce){.orbit-item-inner{transition:none}}
/* make the category panel run edge to edge (must come after the older .cats rules) */
.cats{display:block;overflow:visible;padding:0}
.cpanel{flex:none}

.stickwrap{position:sticky;top:0;z-index:4}
.cv .ohead{position:relative;padding-top:12px}

.cv .pbar{position:relative;padding-top:calc(6px + env(safe-area-inset-top,0px))}
.pbar,.promo{cursor:pointer}
.cvlist .cc{flex:none;width:auto;margin-bottom:10px}
.pimg .qb{position:absolute;top:6px;left:6px;z-index:2;background:var(--wine);color:#fff;font:700 12px/1 sans-serif;padding:3px 8px;border-radius:10px}
.cc .lgo{margin-top:2px}

async function qrOnly(){const p=prod();if(!p){alert('Choose a product first.');return}const c=document.createElement('canvas'),S2=1000;c.width=S2;c.height=S2+140;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
 const link=st.base.replace(/#.*$/,'').replace(/\/?$/,'/')+'#product='+encodeURIComponent(p.id);window.DKQR.draw(x,link,40,40,S2-80,{fg:'#111',level:'M',quiet:1});x.fillStyle='#111';x.textAlign='center';x.font='700 54px Arial,sans-serif';x.fillText(p.name.slice(0,34),S2/2,S2+40);
 x.font='400 34px Arial,sans-serif';x.fillStyle='#555';x.fillText('Scan to see it on D&K Beverages',S2/2,S2+100);save(await toBlob(c,'image/png'),`dk-qr-${slug(p.name)}.png`)}

const CUR='$',CATS=['Red','White','Rosé','Sparkling','Spirits','Other'],STAT=['New','Confirmed','Shipped','Delivered','Cancelled'];
const EM={Red:'🍷',White:'🥂',Rosé:'🌸',Sparkling:'🍾',Spirits:'🥃',Other:'🍇'};
let db=null,uid=null,isAdmin=false,asCust=false,tab='shop',cat='All',aged=true,modal=null,detail=null,dq=1,resetSc=false,topNext=false,brandF=null,popC=null,catsOpen=false,ord=null,peek=null,held=false,srch='',prof={name:'',phone:'',region:'',address:''},msg='',regionF='All';
const S={products:[],combos:[],promos:[],ads:[],categories:[],contact:{},theme:{},orders:[],mine:[]},cart={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=n=>'UGX '+Math.round(n).toLocaleString('en-US');
const psave=(x,price)=>x.kind==='amt'?Math.min(+x.pct||0,price):price*(+x.pct||0)/100;
const dsave=p=>Math.max(0,...S.promos.filter(x=>x.active&&pmatch(x,p)).map(x=>psave(x,p.price)));
const pct=p=>{const s=dsave(p);return s>0&&p.price>0?Math.max(1,Math.round(s/p.price*100)):0};
const fin=p=>p.price-dsave(p);
const P=id=>S.products.find(p=>p.id===id);
const admin=()=>isAdmin&&!asCust;

function cartLines(){return Object.entries(cart).map(([k,q])=>{const [t,id]=k.split(':');
 if(t==='p'){const p=P(id);return p&&{k,n:p.name,q,p:fin(p)}}
 const c=S.combos.find(x=>x.id===id);return c&&{k,n:'Combo: '+c.name,q,p:cfin(c),it:(c.items||[]).map(i=>({n:(P(i.id)||{}).name||'Item',q:i.q}))}}).filter(Boolean)}
const total=()=>cartLines().reduce((s,l)=>s+l.p*l.q,0);

function prodCard(p){const d=pct(p),out=p.inStock===false,q=cart['p:'+p.id]||0;return `<div class="prow" data-a="detail" data-id="${p.id}"><div class="pi"><b>${esc(p.name)}</b><div class="mute">${esc(p.desc||'')}</div><div class="mute">${esc(p.category)}${p.origin?' · '+esc(p.origin):''}</div><div class="price">${m(fin(p))} ${d?`<span class="old">${m(p.price)}</span> <span class="badge">-${d}%</span>`:''}</div></div><div class="pimg">${p.img?`<img src="${p.img}" alt="">`:(EM[p.category]||'🍷')}${out?'<i class="soldout">Sold out</i>':`<button class="plus ${q?'on':''}" data-a="add" data-k="p:${p.id}">${q||'+'}</button>`}</div></div>`}
function prodCardOld(p){const d=pct(p);return `<div class="card"><div class="em">${EM[p.category]||'🍷'}</div>
<b>${esc(p.name)}</b><div class="mute">${esc(p.category)} · ${esc(p.origin||'')}</div>
<div class="mute">${esc(p.desc||'')}</div>
<div class="price">${m(fin(p))} ${d?`<span class="old">${m(p.price)}</span> <span class="badge">-${d}%</span>`:''}</div>
${p.inStock===false?'<div class="mute">Out of stock</div>':`<button class="btn" data-a="add" data-k="p:${p.id}">Add to cart</button>`}</div>`}

function shop(){
 const act=S.promos.filter(x=>x.active);
 const list=S.products.filter(p=>(cat==='All'||p.category===cat)&&(!brandF||p.brand===brandF));
 return `${festive()}<div class="hero">${act.map(x=>`<div class="promo" data-a="openpromo" data-id="${x.id}"><span class="badge">PROMO</span><b>${esc(x.title)}</b><span>${esc(pdisc(x))} ${esc(pdesc(x))}</span><span style="font-weight:800;font-size:13px;margin-top:4px">See the products ›</span></div>`).join('')||'<div class="promo"><b>Drinks delivered nationwide</b><span>Order today, enjoy tonight</span></div>'}</div>
 <div class="cats">${catsHtml()}</div>
 <div class="eta">🛵 Delivery: ${esc(S.contact.delivery||'1–3 days')} · All regions</div>
 ${homeCombos()}<h2>${brandF?esc(brandF):(cat==='All'?'Popular':cat)} ${(brandF||cat!=='All')?'<button class="btn sm ghost" data-a="clrb">Show all</button>':''}</h2>
 ${list.length?`<div class="plist">${list.map(prodCard).join('')}</div>`:'<p class="mute">No products yet. Check back soon!</p>'}`}
function shopOld(){
 const act=S.promos.filter(x=>x.active);
 const list=S.products.filter(p=>cat==='All'||p.category===cat);
 return `${act.map(x=>`<div class="banner"><b>${esc(x.title)}</b><div>${x.pct}% off ${x.scope==='All'?'everything':esc(x.scope)+' wines'}</div></div>`).join('')}
 <div class="tabs" style="padding:0 0 8px">${['All',...CATS].map(c=>`<button class="tab ${c===cat?'on':''}" data-a="cat" data-v="${c}">${c}</button>`).join('')}</div>
 ${list.length?`<div class="grid">${list.map(prodCard).join('')}</div>`:'<p class="mute">No products yet. Check back soon!</p>'}`}

function combos(){const a=S.combos.filter(c=>c.active);
 return a.length?a.map(c=>{const items=(c.items||[]).map(i=>(P(i.id)?i.q+'× '+esc(P(i.id).name):'')).filter(Boolean).join(', ');
 const was=(c.items||[]).reduce((s,i)=>s+(P(i.id)?fin(P(i.id))*i.q:0),0);
 return `<div class="card list" data-a="opencombo" data-id="${c.id}" style="cursor:pointer"><b>🎁 ${esc(c.name)}</b><div class="mute">${items}</div>
 <div class="price">${m(cfin(c))} ${was>cfin(c)?`<span class="old">${m(Math.max(was,c.price))}</span> <span class="badge">Save ${m(Math.max(was,c.price)-cfin(c))}</span>`:''}</div>
 <button class="btn" data-a="add" data-k="c:${c.id}">Add combo</button></div>`}).join(''):'<p class="mute">No combo deals right now.</p>'}

function cartView(){const L=cartLines();
 if(!L.length&&!S.mine.length)return '<div style="text-align:center;padding:40px 0"><div class="em">🧾</div><b>No orders yet</b><div class="mute">Items you add will appear here.</div></div>';

function makeDb(sb){
 const T='docs';
 const listen=(name,fn)=>{fn();const ch=sb.channel('rt-'+name+'-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:T,filter:'coll=eq.'+name},()=>fn()).subscribe();return()=>sb.removeChannel(ch)};
 const ref=(name,id)=>({id,
  async get(){const {data,error}=await sb.from(T).select('id,data').eq('coll',name).eq('id',id).maybeSingle();if(error)throw error;return {exists:!!data,id,data:()=>data?data.data:undefined}},
  async set(d){const {error}=await sb.from(T).upsert({coll:name,id,data:d,updated_at:new Date().toISOString()});if(error)throw error},
  async update(d){const s=await this.get();const {error}=await sb.from(T).update({data:{...(s.exists?s.data():{}),...d},updated_at:new Date().toISOString()}).eq('coll',name).eq('id',id);if(error)throw error},
  async delete(){const {error}=await sb.from(T).delete().eq('coll',name).eq('id',id);if(error)throw error},
  onSnapshot(cb,err){return listen(name,async()=>{try{cb(await this.get())}catch(e){err&&err(e)}})}
 });
 return {collection:name=>({
  doc:id=>ref(name,id),
  async add(d){const id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);const {error}=await sb.from(T).insert({coll:name,id,data:d});if(error)throw error;return ref(name,id)},
  onSnapshot(cb,err){return listen(name,async()=>{const {data,error}=await sb.from(T).select('id,data').eq('coll',name);if(error){err&&err(error);return}cb({docs:data.map(r=>({id:r.id,data:()=>r.data}))})})}
 })}}

function loginView(sb,err){
 if(window.hideSplash)hideSplash();
 $('#app').innerHTML=`<div class="login"><img src="${LOGO}" alt="" style="width:96px;height:96px;border-radius:50%"><h2>D&amp;K Beverages Admin</h2><p class="mute">Staff only. Sign in to manage the shop.</p>${err?`<div class="banner" style="background:#b3262e">${esc(err)}</div>`:''}<label>Email</label><input id="le" type="email" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password"><button class="btn" id="lb">Sign in</button></div>`;
 const go=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(error){loginView(sb,'Wrong email or password.');return}location.reload()};
 $('#lb').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()}}

/* BOOT */
/* A QR code / shared link like  <shop>/#product=<id>  opens that product straight away */
let pendingProd=(/[#&]product=([\w.~%-]+)/.exec(location.hash)||[])[1]||null;if(pendingProd){try{pendingProd=decodeURIComponent(pendingProd)}catch(e){}}
const openProdFromLink=()=>{if(!pendingProd||isAdmin)return;if(P(pendingProd)){detail=pendingProd;pendingProd=null;dq=1;resetSc=true;peek=null;tab='shop';try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}};
window.addEventListener('hashchange',()=>{const mm=/[#&]product=([\w.~%-]+)/.exec(location.hash);if(mm&&!isAdmin){try{pendingProd=decodeURIComponent(mm[1])}catch(e){pendingProd=mm[1]}openProdFromLink();render()}});
let rq=0;const softRender=()=>{if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})};
const need=new Set(['products','combos','promos','ads','categories','contact','theme','orders']);
const got=n=>{need.delete(n);if(!need.size&&window.hideSplash)hideSplash()};
(async()=>{
 if(APP_MODE==='admin')aged=true;
 render();
 try{
  if(!window.supabase||!window.SUPABASE_URL||/YOUR-/.test(window.SUPABASE_URL)){window.CONNECT_ERR='This shop is not connected yet. Add your Supabase details in config.js.';render();if(window.hideSplash)hideSplash();return}
  const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);window._sb=sb;
  let {data:{session}}=await sb.auth.getSession();
  if(APP_MODE==='admin'){
   if(!session||session.user.is_anonymous){loginView(sb);return}
   const {data:adm}=await sb.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();
   if(!adm){await sb.auth.signOut();loginView(sb,'This account is not an administrator.');return}
   isAdmin=true;
  }else if(!session){const r=await sb.auth.signInAnonymously();session=r.data&&r.data.session}
  uid=session?session.user.id:'guest';
  db=makeDb(sb);
  ['products','combos','promos','ads','categories'].forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));if(c==='categories')syncCats();if(c==='products')openProdFromLink();softRender();got(c)},()=>{got(c)}));
  db.collection('settings').doc('contact').onSnapshot(s=>{S.contact=s.exists?s.data():{};softRender();got('contact')},()=>{got('contact')});
  db.collection('settings').doc('theme').onSnapshot(s=>{S.theme=s.exists?s.data():{};softRender();got('theme')},()=>{got('theme')});
  db.collection('orders').onSnapshot(s=>{S.orders=s.docs.map(d=>({id:d.id,...d.data()}));S.mine=S.orders.filter(o=>o.uid===uid).sort((a,b)=>a.ts-b.ts);softRender();got('orders')},()=>{got('orders')});
  if(uid!=='guest')db.collection('profiles').doc(uid).onSnapshot(s=>{if(s.exists)prof={...prof,...s.data()};softRender()},()=>{});
  tab=isAdmin?'orders':'shop';render();setTimeout(()=>{if(window.hideSplash)hideSplash()},3500);
 }catch(e){window.CONNECT_ERR='Could not connect to the shop. Please try again.';render();if(window.hideSplash)hideSplash()}
})();
</script>
